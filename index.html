<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Thiệp Mời Lễ Tốt Nghiệp - Nguyễn Gia Vy 🎓</title>

  <!-- Primary Meta Tags for Social Sharing -->
  <meta name="title" content="Thiệp Mời Lễ Tốt Nghiệp - Nguyễn Gia Vy 🎓">
  <meta name="description"
    content="Thương mời bạn đến chung vui ngày lễ tốt nghiệp cùng Nguyễn Gia Vy tại Trường ĐH Công Nghiệp TP.HCM!">
  <meta name="theme-color" content="#fff5f7">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- Google Fonts: Patrick Hand, Mali, Itim, Plus Jakarta Sans, Alex Brush -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Mali:wght@600;700&family=Itim&family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- Fullscreen Canvas for Floating Sparkles & Soft Petals -->
  <canvas id="petalCanvas"></canvas>

  <!-- Top Party Bunting Garland (Dây cờ tam giác hồng) -->
  <div class="bunting-garland" aria-hidden="true">
    <div class="bunting-flag flag-1"></div>
    <div class="bunting-flag flag-2"></div>
    <div class="bunting-flag flag-3"></div>
    <div class="bunting-flag flag-4"></div>
    <div class="bunting-flag flag-5"></div>
    <div class="bunting-flag flag-6"></div>
    <div class="bunting-flag flag-7"></div>
    <div class="bunting-flag flag-8"></div>
    <div class="bunting-flag flag-9"></div>
    <div class="bunting-flag flag-10"></div>
    <div class="bunting-flag flag-11"></div>
    <div class="bunting-flag flag-12"></div>
    <div class="bunting-flag flag-13"></div>
    <div class="bunting-flag flag-14"></div>
  </div>

  <!-- Aesthetic Stickers Background Layer -->
  <div class="aesthetic-stickers-layer" aria-hidden="true">

    <!-- Top-Left: Cute Teddy Bear with Red Beret & Strawberry Bag sitting on a Ribbon -->
    <div class="sticker sticker-bear-group">
      <!-- Pink Ribbon Under Bear -->
      <svg class="sticker-ribbon-bow" viewBox="0 0 100 80" fill="none">
        <path d="M 50 40 C 35 15 10 15 10 35 C 10 50 35 48 50 42 C 65 48 90 50 90 35 C 90 15 65 15 50 40 Z"
          fill="#ffb6c7" stroke="#ea5b7c" stroke-width="3" stroke-linejoin="round" />
        <path d="M 45 42 C 38 58 25 72 15 78 C 22 75 35 60 48 45" fill="#ffb6c7" stroke="#ea5b7c" stroke-width="3" />
        <path d="M 55 42 C 62 58 75 72 85 78 C 78 75 65 60 52 45" fill="#ffb6c7" stroke="#ea5b7c" stroke-width="3" />
        <circle cx="50" cy="41" r="7" fill="#f06292" stroke="#ea5b7c" stroke-width="3" />
      </svg>
      <!-- Teddy Bear -->
      <svg class="sticker-teddy" viewBox="0 0 80 90" fill="none">
        <!-- Ears -->
        <circle cx="24" cy="24" r="10" fill="#bfa07e" stroke="#8d6e63" stroke-width="2.5" />
        <circle cx="24" cy="24" r="5" fill="#e8c9b0" />
        <circle cx="56" cy="24" r="10" fill="#bfa07e" stroke="#8d6e63" stroke-width="2.5" />
        <circle cx="56" cy="24" r="5" fill="#e8c9b0" />
        <!-- Head -->
        <ellipse cx="40" cy="38" rx="22" ry="19" fill="#cbb092" stroke="#8d6e63" stroke-width="2.5" />
        <!-- Red Beret Hat -->
        <path d="M 18 24 C 20 12 50 10 60 20 C 62 25 22 28 18 24 Z" fill="#d32f2f" />
        <circle cx="40" cy="13" r="2.5" fill="#b71c1c" />
        <!-- Eyes & Snout -->
        <circle cx="32" cy="36" r="2.8" fill="#3e2723" />
        <circle cx="48" cy="36" r="2.8" fill="#3e2723" />
        <ellipse cx="40" cy="43" rx="7" ry="5.5" fill="#f5ebe1" />
        <ellipse cx="40" cy="41.5" rx="3" ry="2" fill="#3e2723" />
        <path d="M 40 43.5 V 46" stroke="#3e2723" stroke-width="1.5" stroke-linecap="round" />
        <!-- Body -->
        <ellipse cx="40" cy="65" rx="19" ry="18" fill="#cbb092" stroke="#8d6e63" stroke-width="2.5" />
        <ellipse cx="40" cy="66" rx="11" ry="11" fill="#dfc6ad" />
        <!-- Paws -->
        <ellipse cx="22" cy="60" rx="6" ry="10" fill="#bfa07e" stroke="#8d6e63" stroke-width="2"
          transform="rotate(20 22 60)" />
        <ellipse cx="58" cy="60" rx="6" ry="10" fill="#bfa07e" stroke="#8d6e63" stroke-width="2"
          transform="rotate(-20 58 60)" />
        <ellipse cx="30" cy="80" rx="7" ry="5" fill="#bfa07e" stroke="#8d6e63" stroke-width="2" />
        <ellipse cx="50" cy="80" rx="7" ry="5" fill="#bfa07e" stroke="#8d6e63" stroke-width="2" />
        <!-- Strawberry Bag -->
        <path d="M 28 62 Q 40 70 48 76" stroke="#b71c1c" stroke-width="1.5" stroke-linecap="round" />
        <g transform="translate(32, 64) scale(0.65)">
          <path d="M 12 3 C 8 3 4 7 4 13 C 4 20 12 25 12 25 C 12 25 20 20 20 13 C 20 7 16 3 12 3 Z" fill="#e53935" />
          <path d="M 12 1 L 10 4 L 14 4 Z" fill="#43a047" />
          <circle cx="9" cy="11" r="0.9" fill="#fff" opacity="0.8" />
          <circle cx="15" cy="11" r="0.9" fill="#fff" opacity="0.8" />
          <circle cx="12" cy="16" r="0.9" fill="#fff" opacity="0.8" />
        </g>
      </svg>
    </div>

    <!-- Top-Right: Hand-drawn Pink Heart & Stitched Red Star -->
    <div class="sticker sticker-heart-top">
      <svg viewBox="0 0 80 80" width="62" height="62" fill="none">
        <path
          d="M 40 68 C 40 68 12 50 12 28 C 12 15 23 8 34 14 C 38 16 40 20 40 20 C 40 20 42 16 46 14 C 57 8 68 15 68 28 C 68 50 40 68 40 68 Z"
          stroke="#e91e63" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <div class="sticker sticker-star-red">
      <svg viewBox="0 0 60 60" width="46" height="46" fill="none">
        <path d="M 30 5 L 37 20 L 54 22 L 41 34 L 45 50 L 30 42 L 15 50 L 19 34 L 6 22 L 23 20 Z" fill="#a0283c"
          stroke="#ffffff" stroke-width="2" stroke-dasharray="3,2" stroke-linejoin="round" />
      </svg>
    </div>

    <!-- Middle Sparkle Stars -->
    <div class="sticker sparkle-star sp-1">✦</div>
    <div class="sticker sparkle-star sp-2">✦</div>
    <div class="sticker sparkle-star sp-3">✦</div>
    <div class="sticker sparkle-star sp-4">✦</div>

    <!-- Bottom-Right: "ALL YOU NEED IS LOVE" Vintage Badge & Heart -->
    <div class="sticker sticker-love-badge">
      <svg viewBox="0 0 110 110" width="86" height="86" fill="none">
        <!-- Heart Base with stitched border -->
        <path
          d="M 55 98 C 55 98 10 70 10 38 C 10 18 26 8 42 16 C 49 20 55 27 55 27 C 55 27 61 20 68 16 C 84 8 100 18 100 38 C 100 70 55 98 55 98 Z"
          fill="#ffffff" stroke="#c2185b" stroke-width="4" />
        <path
          d="M 55 92 C 55 92 16 66 16 38 C 16 22 29 14 43 20 C 49 24 55 29 55 29 C 55 29 61 24 67 20 C 81 14 94 22 94 38 C 94 66 55 92 55 92 Z"
          stroke="#e91e63" stroke-width="1.8" stroke-dasharray="3,2" />
        <!-- Groovy Text -->
        <text x="55" y="42" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="13"
          fill="#a0283c" text-anchor="middle" letter-spacing="1">ALL YOU</text>
        <text x="55" y="58" font-family="'Plus Jakarta Sans', sans-serif" font-weight="800" font-size="12"
          fill="#a0283c" text-anchor="middle" letter-spacing="0.5">NEED IS</text>
        <text x="55" y="78" font-family="'Plus Jakarta Sans', sans-serif" font-weight="900" font-size="18"
          fill="#d81b60" text-anchor="middle">LOVE</text>
      </svg>
    </div>

    <div class="sticker sticker-heart-bottom">
      <svg viewBox="0 0 80 80" width="52" height="52" fill="none">
        <path
          d="M 40 68 C 40 68 12 50 12 28 C 12 15 23 8 34 14 C 38 16 40 20 40 20 C 40 20 42 16 46 14 C 57 8 68 15 68 28 C 68 50 40 68 40 68 Z"
          stroke="#ff4081" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </div>

    <!-- Soft Pastel Flowers (Lilies) -->
    <div class="sticker sticker-flower-pink">
      <svg viewBox="0 0 60 60" width="48" height="48" fill="none">
        <g opacity="0.88">
          <ellipse cx="30" cy="18" rx="8" ry="15" fill="#ffcdd2" transform="rotate(0 30 18)" />
          <ellipse cx="42" cy="24" rx="8" ry="15" fill="#f8bbd0" transform="rotate(60 42 24)" />
          <ellipse cx="42" cy="38" rx="8" ry="15" fill="#ffcdd2" transform="rotate(120 42 38)" />
          <ellipse cx="30" cy="44" rx="8" ry="15" fill="#f8bbd0" transform="rotate(180 30 44)" />
          <ellipse cx="18" cy="38" rx="8" ry="15" fill="#ffcdd2" transform="rotate(240 18 38)" />
          <ellipse cx="18" cy="24" rx="8" ry="15" fill="#f8bbd0" transform="rotate(300 18 24)" />
          <circle cx="30" cy="30" r="5" fill="#fff59d" />
        </g>
      </svg>
    </div>

    <div class="sticker sticker-flower-blue">
      <svg viewBox="0 0 60 60" width="46" height="46" fill="none">
        <g opacity="0.85">
          <ellipse cx="30" cy="18" rx="7" ry="14" fill="#bbdefb" transform="rotate(0 30 18)" />
          <ellipse cx="42" cy="24" rx="7" ry="14" fill="#e1f5fe" transform="rotate(60 42 24)" />
          <ellipse cx="42" cy="38" rx="7" ry="14" fill="#bbdefb" transform="rotate(120 42 38)" />
          <ellipse cx="30" cy="44" rx="7" ry="14" fill="#e1f5fe" transform="rotate(180 30 44)" />
          <ellipse cx="18" cy="38" rx="7" ry="14" fill="#bbdefb" transform="rotate(240 18 38)" />
          <ellipse cx="18" cy="24" rx="7" ry="14" fill="#e1f5fe" transform="rotate(300 18 24)" />
          <circle cx="30" cy="30" r="4.5" fill="#fff9c4" />
        </g>
      </svg>
    </div>

    <!-- Bottom-Left Pink Ribbon Bow -->
    <div class="sticker sticker-bow-bottom">
      <svg viewBox="0 0 100 80" width="60" height="48" fill="none">
        <path d="M 50 40 C 35 15 10 15 10 35 C 10 50 35 48 50 42 C 65 48 90 50 90 35 C 90 15 65 15 50 40 Z"
          fill="#ffb6c7" stroke="#ea5b7c" stroke-width="3" stroke-linejoin="round" />
        <path d="M 45 42 C 38 58 25 72 15 78 C 22 75 35 60 48 45" fill="#ffb6c7" stroke="#ea5b7c" stroke-width="3" />
        <path d="M 55 42 C 62 58 75 72 85 78 C 78 75 65 60 52 45" fill="#ffb6c7" stroke="#ea5b7c" stroke-width="3" />
        <circle cx="50" cy="41" r="7" fill="#f06292" stroke="#ea5b7c" stroke-width="3" />
      </svg>
    </div>
  </div>

  <!-- Central Screen: Realistic Burgundy Envelope with Wax Seal -->
  <main class="intro-screen">

    <!-- Playful Handwritten Prompt -->
    <p class="envelope-handwritten-prompt" id="envelopePrompt">Ấn vào phong bì bên dưới này điii</p>

    <!-- The 3D Tactile Envelope Container -->
    <div class="envelope-interactive" id="envelopeInteractive" role="button" tabindex="0"
      aria-label="Mở phong bì thiệp">

      <!-- Personalized Nametag Ribbon on Envelope -->
      <div class="envelope-nametag" id="envelopeNametag" style="display: none;"></div>

      <!-- Envelope Body -->
      <div class="envelope-container" id="envelopeContainer">

        <!-- Back of Envelope -->
        <div class="envelope-back"></div>

        <!-- The Card inside that peeks out -->
        <div class="envelope-letter" id="envelopeLetter">
          <img src="5.png" alt="Thiệp Mời" class="letter-preview-img">
        </div>

        <!-- Left & Right Folded Flaps -->
        <div class="envelope-pocket"></div>

        <!-- Top Triangular Flap that folds open -->
        <div class="envelope-flap-top" id="envelopeFlapTop"></div>

        <!-- Wax Seal (Con dấu sáp đỏ niêm phong) -->
        <div class="wax-seal" id="waxSeal">
          <div class="seal-texture">
            <!-- Embossed Floral Emblem on the wax -->
            <svg viewBox="0 0 32 32" class="seal-flower-icon" fill="none">
              <circle cx="16" cy="16" r="14" stroke="rgba(255,255,255,0.3)" stroke-width="1.2"
                stroke-dasharray="2,1.5" />
              <!-- Rose/Poppy flower embossed in wax -->
              <path
                d="M 16 9 C 13 9 11 12 12 15 C 10 16 9 19 11 21 C 12 23 15 24 16 24 C 17 24 20 23 21 21 C 23 19 22 16 20 15 C 21 12 19 9 16 9 Z"
                fill="#6e1425" opacity="0.9" />
              <circle cx="16" cy="16" r="3.2" fill="#580f1e" />
            </svg>
          </div>
          <div class="seal-shadow"></div>
        </div>

      </div>

    </div>

    <!-- Small gentle hint -->
    <p class="touch-hint">Chạm vào phong bì để mở thiệp tốt nghiệp</p>
  </main>

  <!-- Fullscreen Modal / Multi-Page Invitation (Mobile Optimized) -->
  <section class="modal-invitation" id="invitationModal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-container">

      <!-- Navigation Tabs (Thiệp Mời & Sơ Đồ) -->
      <div class="modal-nav">
        <button class="nav-tab active" data-tab="tab-invite">💌 Thiệp Mời</button>
        <button class="nav-tab" data-tab="tab-map">🗺️ Sơ Đồ & Chỉ Đường</button>
        <button class="btn-close-modal" id="closeModalBtn" aria-label="Đóng">&times;</button>
      </div>

      <!-- Scrollable Content Area -->
      <div class="modal-scroll-area">

        <!-- Tab 1: Invitation Card (1.png / 2.png / 3.png) -->
        <div class="tab-pane active" id="tab-invite">
          <!-- Personalized Greeting Badge -->
          <div class="modal-guest-badge" id="modalGuestBadge" style="display: none;"></div>

          <!-- Time Slot Selector -->
          <div class="time-selector">
            <span class="selector-label">Chọn khung giờ dự lễ:</span>
            <div class="time-pills">
              <button class="time-pill active" data-img="1.png">09:30</button>
              <button class="time-pill" data-img="2.png">10:00</button>
              <button class="time-pill" data-img="3.png">10:30</button>
            </div>
          </div>

          <!-- Invitation Card Image with tap hint -->
          <div class="invitation-image-wrap">
            <img src="1.png" alt="Thiệp Mời Lễ Tốt Nghiệp Gia Vy" class="card-photo" id="invitePhoto">
          </div>
        </div>

        <!-- Tab 2: Map & Directions (4.png) -->
        <div class="tab-pane" id="tab-map">
          <div class="map-image-wrap">
            <img src="4.png" alt="Sơ đồ tòa nhà Đại học Công nghiệp TPHCM" class="card-photo">
          </div>

          <!-- Quick Action Buttons for Guests -->
          <div class="quick-contact-actions">
            <a href="tel:0941653262" class="action-link link-call">
              <span class="link-icon">📞</span>
              <span>Gọi cho Vy (0941 653 262)</span>
            </a>
            <a href="https://maps.google.com/?q=12+Nguyen+Van+Bao+Phuong+4+Go+Vap+Ho+Chi+Minh" target="_blank"
              rel="noopener noreferrer" class="action-link link-maps">
              <span class="link-icon">📍</span>
              <span>Mở Google Maps chỉ đường</span>
            </a>
          </div>
        </div>

      </div>

    </div>
  </section>

  <!-- Toast Notification Popup -->
  <div class="toast-popup" id="toastPopup">Đã sao chép link thiệp thành công! ✨</div>

  <!-- Floating Audio Button -->
  <div class="audio-toggle-btn" id="audioToggle" title="Bật/Tắt nhạc nền nhẹ">
    <span class="audio-symbol">🎵</span>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>

</html>
