<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Thiệp Mời Lễ Tốt Nghiệp - Nguyễn Gia Vy 🎓</title>
  
  <!-- Primary Meta Tags for Social Sharing -->
  <meta name="title" content="Thiệp Mời Lễ Tốt Nghiệp - Nguyễn Gia Vy 🎓">
  <meta name="description" content="Thương mời bạn đến chung vui ngày lễ tốt nghiệp cùng Nguyễn Gia Vy tại Trường ĐH Công Nghiệp TP.HCM!">
  <meta name="theme-color" content="#fca7c4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Canvas for Floating Daisy & Wildflower Petals -->
  <canvas id="petalCanvas"></canvas>

  <!-- Sky Atmosphere: Soft Twilight Glow & Drifting Pink Clouds -->
  <div class="sky-container">
    <div class="sun-flare"></div>
    <div class="dream-cloud cloud-top"></div>
    <div class="dream-cloud cloud-middle"></div>
    <div class="dream-cloud cloud-bottom"></div>
  </div>

  <!-- SVG Wildflower Meadow ("Bụi hoa dại") - Chic & Youthful -->
  <div class="floral-overlay">
    
    <svg width="0" height="0" class="svg-definitions">
      <defs>
        <!-- Stem & Leaf Gradients -->
        <linearGradient id="stemGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#3d6635"/>
          <stop offset="60%" stop-color="#5a8b50"/>
          <stop offset="100%" stop-color="#80af75"/>
        </linearGradient>

        <linearGradient id="leafGradMeadow" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#46733c"/>
          <stop offset="100%" stop-color="#8bc34a"/>
        </linearGradient>

        <!-- Daisy Petal Gradient (Crisp pure white with soft cream tint) -->
        <linearGradient id="daisyWhitePetal" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#f5e6eb"/>
          <stop offset="40%" stop-color="#ffffff"/>
          <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>

        <!-- Daisy Warm Golden Sun Center -->
        <radialGradient id="daisySunCore" cx="40%" cy="40%" r="60%">
          <stop offset="0%" stop-color="#fff176"/>
          <stop offset="50%" stop-color="#fbc02d"/>
          <stop offset="85%" stop-color="#f57f17"/>
          <stop offset="100%" stop-color="#e65100"/>
        </radialGradient>

        <!-- Pastel Pink Wildflower Petal Gradient -->
        <linearGradient id="pinkWildPetal" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#f48fb1"/>
          <stop offset="50%" stop-color="#ffb9cf"/>
          <stop offset="100%" stop-color="#fff5f8"/>
        </linearGradient>

        <!-- Cute White Daisy (Hoa cúc họa mi / Chamomile) -->
        <g id="wildDaisy">
          <g class="flower-petals-spin">
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(30)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(60)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(90)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(120)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(150)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(180)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(210)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(240)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(270)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(300)"/>
            <ellipse cx="0" cy="-18" rx="4.8" ry="11" fill="url(#daisyWhitePetal)" transform="rotate(330)"/>
          </g>
          <!-- Center Sun Core -->
          <circle cx="0" cy="0" r="9.5" fill="url(#daisySunCore)"/>
          <circle cx="0" cy="0" r="6" fill="#fbc02d" opacity="0.8"/>
          <circle cx="0" cy="0" r="3" fill="#e65100" opacity="0.7"/>
        </g>

        <!-- Pastel Pink Wildflower (Hoa dại cánh hồng phấn) -->
        <g id="pinkMeadowFlower">
          <g class="flower-petals-spin">
            <ellipse cx="0" cy="-15" rx="5.5" ry="9.5" fill="url(#pinkWildPetal)"/>
            <ellipse cx="0" cy="-15" rx="5.5" ry="9.5" fill="url(#pinkWildPetal)" transform="rotate(45)"/>
            <ellipse cx="0" cy="-15" rx="5.5" ry="9.5" fill="url(#pinkWildPetal)" transform="rotate(90)"/>
            <ellipse cx="0" cy="-15" rx="5.5" ry="9.5" fill="url(#pinkWildPetal)" transform="rotate(135)"/>
            <ellipse cx="0" cy="-15" rx="5.5" ry="9.5" fill="url(#pinkWildPetal)" transform="rotate(180)"/>
            <ellipse cx="0" cy="-15" rx="5.5" ry="9.5" fill="url(#pinkWildPetal)" transform="rotate(225)"/>
            <ellipse cx="0" cy="-15" rx="5.5" ry="9.5" fill="url(#pinkWildPetal)" transform="rotate(270)"/>
            <ellipse cx="0" cy="-15" rx="5.5" ry="9.5" fill="url(#pinkWildPetal)" transform="rotate(315)"/>
          </g>
          <circle cx="0" cy="0" r="7.5" fill="url(#daisySunCore)"/>
          <circle cx="0" cy="0" r="3.5" fill="#f57f17"/>
        </g>

        <!-- Baby's Breath & Tiny Wild Buds -->
        <g id="babyBudCluster">
          <circle cx="0" cy="-10" r="5" fill="#ffffff" opacity="0.95"/>
          <circle cx="0" cy="-10" r="2.2" fill="#ffe082"/>
          <circle cx="8" cy="-3" r="4.2" fill="#ffd1dc" opacity="0.95"/>
          <circle cx="-8" cy="-3" r="4.2" fill="#ffffff" opacity="0.95"/>
          <circle cx="5" cy="7" r="3.8" fill="#ffffff" opacity="0.9"/>
          <circle cx="-5" cy="7" r="3.8" fill="#ffd1dc" opacity="0.9"/>
        </g>
      </defs>
    </svg>

    <!-- Bottom Left Wildflower Meadow Bush ("Bụi hoa dại bên trái") -->
    <svg class="floral-svg meadow-left" viewBox="0 0 320 380" fill="none">
      <!-- Slender Meadow Stems -->
      <path class="meadow-stem stem-d1" d="M 40 400 C 60 300 70 210 50 120 C 45 90 35 70 25 45" stroke="url(#stemGrad1)" stroke-width="3" stroke-linecap="round"/>
      <path class="meadow-stem stem-d2" d="M 80 400 C 95 320 135 240 160 160 C 175 110 185 80 195 50" stroke="url(#stemGrad1)" stroke-width="3.5" stroke-linecap="round"/>
      <path class="meadow-stem stem-d3" d="M 120 400 C 130 330 190 270 220 200 C 240 160 250 135 260 100" stroke="url(#stemGrad1)" stroke-width="2.8" stroke-linecap="round"/>
      <path class="meadow-stem stem-d4" d="M 20 400 C 35 340 10 270 30 200 C 40 165 55 140 70 115" stroke="url(#stemGrad1)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Fresh Meadow Foliage Leaves -->
      <g class="meadow-leaf leaf-d1" transform="translate(62, 240) rotate(-40)">
        <path d="M 0 0 C 12 -20 28 -20 32 0 C 28 20 12 20 0 0 Z" fill="url(#leafGradMeadow)"/>
      </g>
      <g class="meadow-leaf leaf-d2" transform="translate(135, 230) rotate(35)">
        <path d="M 0 0 C 10 -18 24 -18 28 0 C 24 18 10 18 0 0 Z" fill="url(#leafGradMeadow)"/>
      </g>
      <g class="meadow-leaf leaf-d3" transform="translate(175, 140) rotate(-25)">
        <path d="M 0 0 C 8 -15 20 -15 24 0 C 20 15 8 15 0 0 Z" fill="url(#leafGradMeadow)"/>
      </g>
      <g class="meadow-leaf leaf-d4" transform="translate(42, 170) rotate(50)">
        <path d="M 0 0 C 9 -16 22 -16 26 0 C 22 16 9 16 0 0 Z" fill="url(#leafGradMeadow)"/>
      </g>

      <!-- Wildflower Blossoms Pop -->
      <g transform="translate(195, 50)">
        <g class="wildflower-bloom bloom-d1 bloom-lg">
          <use href="#wildDaisy"/>
        </g>
      </g>
      <g transform="translate(25, 45)">
        <g class="wildflower-bloom bloom-d2 bloom-md">
          <use href="#pinkMeadowFlower"/>
        </g>
      </g>
      <g transform="translate(260, 100)">
        <g class="wildflower-bloom bloom-d3 bloom-md">
          <use href="#wildDaisy"/>
        </g>
      </g>
      <g transform="translate(70, 115)">
        <g class="wildflower-bloom bloom-d4 bloom-sm">
          <use href="#pinkMeadowFlower"/>
        </g>
      </g>
      <g transform="translate(145, 170)">
        <g class="wildflower-bloom bloom-d2">
          <use href="#babyBudCluster"/>
        </g>
      </g>
    </svg>

    <!-- Bottom Right Wildflower Meadow Bush ("Bụi hoa dại bên phải") -->
    <svg class="floral-svg meadow-right" viewBox="0 0 320 380" fill="none">
      <path class="meadow-stem stem-d1" d="M 280 400 C 260 300 250 210 270 120 C 275 90 285 70 295 45" stroke="url(#stemGrad1)" stroke-width="3" stroke-linecap="round"/>
      <path class="meadow-stem stem-d2" d="M 240 400 C 225 320 185 240 160 160 C 145 110 135 80 125 50" stroke="url(#stemGrad1)" stroke-width="3.5" stroke-linecap="round"/>
      <path class="meadow-stem stem-d3" d="M 200 400 C 190 330 130 270 100 200 C 80 160 70 135 60 100" stroke="url(#stemGrad1)" stroke-width="2.8" stroke-linecap="round"/>
      <path class="meadow-stem stem-d4" d="M 300 400 C 285 340 310 270 290 200 C 280 165 265 140 250 115" stroke="url(#stemGrad1)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Leaves -->
      <g class="meadow-leaf leaf-d1" transform="translate(258, 240) rotate(40)">
        <path d="M 0 0 C -12 -20 -28 -20 -32 0 C -28 20 -12 20 0 0 Z" fill="url(#leafGradMeadow)"/>
      </g>
      <g class="meadow-leaf leaf-d2" transform="translate(185, 230) rotate(-35)">
        <path d="M 0 0 C -10 -18 -24 -18 -28 0 C -24 18 -10 18 0 0 Z" fill="url(#leafGradMeadow)"/>
      </g>
      <g class="meadow-leaf leaf-d3" transform="translate(145, 140) rotate(25)">
        <path d="M 0 0 C -8 -15 -20 -15 -24 0 C -20 15 -8 15 0 0 Z" fill="url(#leafGradMeadow)"/>
      </g>

      <!-- Wildflower Blossoms -->
      <g transform="translate(125, 50)">
        <g class="wildflower-bloom bloom-d1 bloom-lg">
          <use href="#wildDaisy"/>
        </g>
      </g>
      <g transform="translate(295, 45)">
        <g class="wildflower-bloom bloom-d3 bloom-md">
          <use href="#pinkMeadowFlower"/>
        </g>
      </g>
      <g transform="translate(60, 100)">
        <g class="wildflower-bloom bloom-d2 bloom-md">
          <use href="#wildDaisy"/>
        </g>
      </g>
      <g transform="translate(250, 115)">
        <g class="wildflower-bloom bloom-d4 bloom-sm">
          <use href="#pinkMeadowFlower"/>
        </g>
      </g>
      <g transform="translate(175, 170)">
        <g class="wildflower-bloom bloom-d2">
          <use href="#babyBudCluster"/>
        </g>
      </g>
    </svg>
  </div>

  <!-- Central Mobile Intro Screen: The Card uses 5.png as its Background -->
  <main class="intro-screen">
    <div class="intro-card-envelope" id="mainIntroCard" title="Nhấn để mở thiệp">
      
      <!-- Top Tag over the striped background -->
      <div class="card-cover-top">
        <span class="cover-tag">✦ LỄ TỐT NGHIỆP ✦</span>
      </div>

      <!-- Recipient Name placed with exact vertical positioning cleanly BELOW "MỜI" -->
      <div class="recipient-name-holder">
        <h2 class="cover-recipient-name">Nguyễn Gia Vy</h2>
      </div>

      <!-- Action Button at the bottom -->
      <div class="card-cover-bottom">
        <button class="open-invitation-btn" id="openInvitationBtn" aria-label="Mở thiệp mời">
          <span class="btn-sparkle">✨</span>
          <span class="btn-label">Mở Thiệp Mời</span>
          <span class="btn-sparkle">✨</span>
          <div class="btn-light-sweep"></div>
        </button>
      </div>

      <!-- Graduation Cap Badge on the corner -->
      <div class="stamp-seal">🎓</div>
    </div>

    <!-- Touch Hint below card -->
    <p class="touch-hint">Chạm vào màn hình để thả hoa rơi</p>
  </main>

  <!-- Fullscreen Modal / Multi-Page Invitation (Mobile Optimized) -->
  <section class="modal-invitation" id="invitationModal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-container">
      
      <!-- Navigation Tabs (Thiệp Mời & Sơ Đồ) -->
      <div class="modal-nav">
        <button class="nav-tab active" data-tab="tab-invite">💌 Thiệp Mời</button>
        <button class="nav-tab" data-tab="tab-map">🗺️ Sơ Đồ & Chỉ Đường</button>
        <button class="btn-close-modal" id="closeModalBtn" aria-label="Đóng">&times;</button>
      </div>

      <!-- Scrollable Content Area -->
      <div class="modal-scroll-area">
        
        <!-- Tab 1: Invitation Card (1.png / 2.png / 3.png) -->
        <div class="tab-pane active" id="tab-invite">
          <!-- Time Slot Selector -->
          <div class="time-selector">
            <span class="selector-label">Chọn khung giờ dự lễ:</span>
            <div class="time-pills">
              <button class="time-pill active" data-img="1.png">09:30</button>
              <button class="time-pill" data-img="2.png">10:00</button>
              <button class="time-pill" data-img="3.png">10:30</button>
            </div>
          </div>

          <!-- Invitation Card Image with tap hint -->
          <div class="invitation-image-wrap">
            <img src="1.png" alt="Thiệp Mời Lễ Tốt Nghiệp Gia Vy" class="card-photo" id="invitePhoto">
          </div>

          <!-- Quick Event Utilities -->
          <div class="event-utilities">
            <a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=L%E1%BB%85+T%E1%BB%91t+Nghi%E1%BB%87p+-+Nguy%E1%BB%85n+Gia+Vy&dates=20261122T023000Z/20261122T050000Z&details=L%E1%BB%85+trao+b%E1%BA%B1ng+t%E1%BB%91t+nghi%E1%BB%87p+Nguy%E1%BB%85n+Gia+Vy+-+Kh%C3%B3a+17+Ng%C3%A0nh+Marketing.+S%C4%90T%3A+0941653262&location=Tr%C6%B0%E1%BB%9Dng+%C4%90%E1%BA%A1i+h%E1%BB%8Dc+C%C3%B4ng+nghi%E1%BB%87p+TP.HCM+-+12+Nguy%E1%BB%85n+V%C4%83n+B%E1%BA%A3o%2C+G%C3%B2+V%E1%BA%A5p%2C+TP.HCM" target="_blank" rel="noopener noreferrer" class="util-btn calendar-btn">
              <span>📅 Thêm vào Google Lịch</span>
            </a>
            
            <div class="utility-row">
              <a href="1.png" download="Thiep-Tot-Nghiep-Gia-Vy.png" class="util-btn download-btn" id="downloadCardBtn">
                <span>📥 Tải thiệp về máy</span>
              </a>
              <button class="util-btn share-btn" id="shareBtn">
                <span>🔗 Sao chép link</span>
              </button>
            </div>
          </div>
        </div>

        <!-- Tab 2: Map & Directions (4.png) -->
        <div class="tab-pane" id="tab-map">
          <div class="map-image-wrap">
            <img src="4.png" alt="Sơ đồ tòa nhà Đại học Công nghiệp TPHCM" class="card-photo">
          </div>

          <!-- Quick Action Buttons for Guests -->
          <div class="quick-contact-actions">
            <a href="tel:0941653262" class="action-link link-call">
              <span class="link-icon">📞</span>
              <span>Gọi cho Vy (0941 653 262)</span>
            </a>
            <a href="https://maps.google.com/?q=12+Nguyen+Van+Bao+Phuong+4+Go+Vap+Ho+Chi+Minh" target="_blank" rel="noopener noreferrer" class="action-link link-maps">
              <span class="link-icon">📍</span>
              <span>Mở Google Maps chỉ đường</span>
            </a>
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="modal-footer-bar">
        <button class="btn-replay" id="replayBtn">🌸 Xem lại Intro nở hoa</button>
      </div>
      
    </div>
  </section>

  <!-- Toast Notification Popup -->
  <div class="toast-popup" id="toastPopup">Đã sao chép link thiệp thành công! ✨</div>

  <!-- Floating Audio Button -->
  <div class="audio-toggle-btn" id="audioToggle" title="Bật/Tắt nhạc nền nhẹ">
    <span class="audio-symbol">🎵</span>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
