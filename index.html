<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Thiệp Mời Tốt Nghiệp - Gia Vy</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,600;0,700;1,400;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Canvas for Floating Sakura Petals & Magic Dust -->
  <canvas id="petalCanvas"></canvas>

  <!-- Sky Atmosphere: Sun Glow & Drifting Pink Clouds -->
  <div class="sky-container">
    <div class="sun-flare"></div>
    <div class="dream-cloud cloud-top"></div>
    <div class="dream-cloud cloud-middle"></div>
    <div class="dream-cloud cloud-bottom"></div>
  </div>

  <!-- SVG Floral Branches & Lush Blooming Flowers (Mobile First) -->
  <div class="floral-overlay">
    
    <!-- SVG Defs for Petal Gradients & Shading -->
    <svg width="0" height="0" class="svg-definitions">
      <defs>
        <!-- Branch Wood Gradient -->
        <linearGradient id="branchWood" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#4a2530"/>
          <stop offset="50%" stop-color="#733b49"/>
          <stop offset="100%" stop-color="#a6586b"/>
        </linearGradient>

        <!-- Sakura Petal Gradient (Vibrant soft pink) -->
        <linearGradient id="sakuraGrad" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#ff7597"/>
          <stop offset="50%" stop-color="#ffb3c6"/>
          <stop offset="100%" stop-color="#ffffff"/>
        </linearGradient>

        <!-- Sakura Petal Deep Gradient -->
        <linearGradient id="sakuraGradDeep" x1="0%" y1="100%" x2="0%" y2="0%">
          <stop offset="0%" stop-color="#e91e63"/>
          <stop offset="50%" stop-color="#f48fb1"/>
          <stop offset="100%" stop-color="#fff0f5"/>
        </linearGradient>

        <!-- Leaf Gradient -->
        <linearGradient id="leafGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#43a047"/>
          <stop offset="100%" stop-color="#81c784"/>
        </linearGradient>

        <!-- Golden Pistil Core -->
        <radialGradient id="goldCore" cx="50%" cy="50%" r="50%">
          <stop offset="0%" stop-color="#ffe082"/>
          <stop offset="60%" stop-color="#ffb300"/>
          <stop offset="100%" stop-color="#e65100"/>
        </radialGradient>

        <!-- Beautiful 5-Petal Sakura Blossom Symbol -->
        <g id="blossomFlower">
          <!-- 5 Sakura Petals with heart-notched tips -->
          <g class="petals-group">
            <path d="M 0 0 C -10 -9 -14 -22 -4 -30 C -1 -27 1 -27 4 -30 C 14 -22 10 -9 0 0 Z" fill="url(#sakuraGrad)" />
            <path d="M 0 0 C -10 -9 -14 -22 -4 -30 C -1 -27 1 -27 4 -30 C 14 -22 10 -9 0 0 Z" fill="url(#sakuraGradDeep)" transform="rotate(72)" />
            <path d="M 0 0 C -10 -9 -14 -22 -4 -30 C -1 -27 1 -27 4 -30 C 14 -22 10 -9 0 0 Z" fill="url(#sakuraGrad)" transform="rotate(144)" />
            <path d="M 0 0 C -10 -9 -14 -22 -4 -30 C -1 -27 1 -27 4 -30 C 14 -22 10 -9 0 0 Z" fill="url(#sakuraGradDeep)" transform="rotate(216)" />
            <path d="M 0 0 C -10 -9 -14 -22 -4 -30 C -1 -27 1 -27 4 -30 C 14 -22 10 -9 0 0 Z" fill="url(#sakuraGrad)" transform="rotate(288)" />
          </g>

          <!-- Golden Stamens & Pistils -->
          <g class="pistil-group">
            <circle cx="0" cy="0" r="5" fill="#f06292" opacity="0.6"/>
            <!-- Stamen dots -->
            <line x1="0" y1="0" x2="0" y2="-10" stroke="#ffa726" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="0" cy="-11" r="1.6" fill="#ffb300"/>
            <line x1="0" y1="0" x2="9.5" y2="-3" stroke="#ffa726" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="10.5" cy="-3.3" r="1.6" fill="#ffb300"/>
            <line x1="0" y1="0" x2="6" y2="8" stroke="#ffa726" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="6.5" cy="8.8" r="1.6" fill="#ffb300"/>
            <line x1="0" y1="0" x2="-6" y2="8" stroke="#ffa726" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="-6.5" cy="8.8" r="1.6" fill="#ffb300"/>
            <line x1="0" y1="0" x2="-9.5" y2="-3" stroke="#ffa726" stroke-width="1.3" stroke-linecap="round"/>
            <circle cx="-10.5" cy="-3.3" r="1.6" fill="#ffb300"/>
            <!-- Center Gold Orb -->
            <circle cx="0" cy="0" r="3.8" fill="url(#goldCore)"/>
          </g>
        </g>

        <!-- Flower Bud Symbol -->
        <g id="blossomBud">
          <ellipse cx="0" cy="-11" rx="8" ry="14" fill="url(#sakuraGradDeep)"/>
          <ellipse cx="2" cy="-10" rx="5" ry="10" fill="url(#sakuraGrad)"/>
          <path d="M -5 0 Q 0 -5 5 0 Q 0 5 -5 0 Z" fill="#43a047"/>
        </g>
      </defs>
    </svg>

    <!-- Top Left Draping Cherry Blossom Branch -->
    <svg class="floral-svg branch-top-left" viewBox="0 0 340 340" fill="none">
      <path class="branch-stem branch-d1" d="M -15 -10 C 60 30 110 60 160 120 C 190 160 205 200 215 250" stroke="url(#branchWood)" stroke-width="5" stroke-linecap="round"/>
      <path class="branch-stem branch-d2" d="M 110 60 C 150 55 195 75 235 110" stroke="url(#branchWood)" stroke-width="3" stroke-linecap="round"/>
      <path class="branch-stem branch-d3" d="M 60 30 C 85 85 105 125 120 165" stroke="url(#branchWood)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Leaves -->
      <g class="leaf-sprout leaf-d1" transform="translate(95, 50) rotate(-40)">
        <path d="M 0 0 C 10 -15 25 -15 30 0 C 25 15 10 15 0 0 Z" fill="url(#leafGrad)"/>
      </g>
      <g class="leaf-sprout leaf-d2" transform="translate(180, 150) rotate(35)">
        <path d="M 0 0 C 8 -12 20 -12 24 0 C 20 12 8 12 0 0 Z" fill="url(#leafGrad)"/>
      </g>

      <!-- Flowers -->
      <g transform="translate(215, 250)">
        <g class="bloom-container bloom-d1 bloom-lg">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(235, 110)">
        <g class="bloom-container bloom-d2 bloom-md">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(160, 120)">
        <g class="bloom-container bloom-d3 bloom-lg">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(120, 165)">
        <g class="bloom-container bloom-d4 bloom-sm">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(185, 190) rotate(-30)">
        <g class="bloom-container bloom-d2">
          <use href="#blossomBud"/>
        </g>
      </g>
    </svg>

    <!-- Bottom Left Growing Cherry Blossom Branch -->
    <svg class="floral-svg branch-bottom-left" viewBox="0 0 360 420" fill="none">
      <path class="branch-stem branch-d1" d="M -15 430 C 45 340 80 260 115 170 C 140 110 170 70 220 30" stroke="url(#branchWood)" stroke-width="6" stroke-linecap="round"/>
      <path class="branch-stem branch-d2" d="M 80 260 C 130 240 165 230 215 210" stroke="url(#branchWood)" stroke-width="3.5" stroke-linecap="round"/>
      <path class="branch-stem branch-d3" d="M 115 170 C 95 120 85 85 75 45" stroke="url(#branchWood)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Leaves -->
      <g class="leaf-sprout leaf-d1" transform="translate(70, 280) rotate(-65)">
        <path d="M 0 0 C 10 -15 25 -15 30 0 C 25 15 10 15 0 0 Z" fill="url(#leafGrad)"/>
      </g>
      <g class="leaf-sprout leaf-d2" transform="translate(140, 130) rotate(20)">
        <path d="M 0 0 C 9 -13 22 -13 26 0 C 22 13 9 13 0 0 Z" fill="url(#leafGrad)"/>
      </g>

      <!-- Flowers -->
      <g transform="translate(220, 30)">
        <g class="bloom-container bloom-d2 bloom-lg">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(215, 210)">
        <g class="bloom-container bloom-d1 bloom-lg">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(125, 150)">
        <g class="bloom-container bloom-d3 bloom-md">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(75, 45)">
        <g class="bloom-container bloom-d4 bloom-sm">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(160, 90) rotate(45)">
        <g class="bloom-container bloom-d1">
          <use href="#blossomBud"/>
        </g>
      </g>
    </svg>

    <!-- Bottom Right Growing Cherry Blossom Branch -->
    <svg class="floral-svg branch-bottom-right" viewBox="0 0 360 420" fill="none">
      <path class="branch-stem branch-d1" d="M 375 430 C 315 340 280 260 245 170 C 220 110 190 70 140 30" stroke="url(#branchWood)" stroke-width="6" stroke-linecap="round"/>
      <path class="branch-stem branch-d2" d="M 280 260 C 230 240 195 230 145 210" stroke="url(#branchWood)" stroke-width="3.5" stroke-linecap="round"/>
      <path class="branch-stem branch-d3" d="M 245 170 C 265 120 275 85 285 45" stroke="url(#branchWood)" stroke-width="2.5" stroke-linecap="round"/>

      <!-- Leaves -->
      <g class="leaf-sprout leaf-d1" transform="translate(290, 280) rotate(65)">
        <path d="M 0 0 C -10 -15 -25 -15 -30 0 C -25 15 -10 15 0 0 Z" fill="url(#leafGrad)"/>
      </g>
      <g class="leaf-sprout leaf-d2" transform="translate(220, 130) rotate(-20)">
        <path d="M 0 0 C -9 -13 -22 -13 -26 0 C -22 13 -9 13 0 0 Z" fill="url(#leafGrad)"/>
      </g>

      <!-- Flowers -->
      <g transform="translate(140, 30)">
        <g class="bloom-container bloom-d1 bloom-lg">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(145, 210)">
        <g class="bloom-container bloom-d3 bloom-lg">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(235, 150)">
        <g class="bloom-container bloom-d2 bloom-md">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(285, 45)">
        <g class="bloom-container bloom-d4 bloom-sm">
          <use href="#blossomFlower"/>
        </g>
      </g>
      <g transform="translate(200, 90) rotate(-45)">
        <g class="bloom-container bloom-d2">
          <use href="#blossomBud"/>
        </g>
      </g>
    </svg>
  </div>

  <!-- Central Mobile Intro Card -->
  <main class="intro-screen">
    <div class="intro-card" id="mainIntroCard">
      
      <!-- Envelope Cover Thumbnail (5.png) -->
      <div class="cover-preview-wrapper" id="coverPreview">
        <div class="cover-glow"></div>
        <img src="5.png" alt="Thiệp Mời Tốt Nghiệp" class="cover-image" id="coverImage">
        <div class="stamp-badge">🎓</div>
      </div>

      <!-- Typography -->
      <div class="card-headings">
        <span class="sub-greeting">✦ LỄ TỐT NGHIỆP ✦</span>
        <h1 class="main-title">
          <span class="script-text">Happy</span>
          <span class="serif-text">GRADUATION</span>
        </h1>
        
        <div class="flower-divider">
          <span class="divider-line"></span>
          <span class="divider-icon">🌸</span>
          <span class="divider-line"></span>
        </div>

        <h2 class="recipient-name">Nguyễn Gia Vy</h2>

        <p class="emotional-quote">
          "Mỗi đóa hoa nở rộ là một ước mơ thành hình.<br>
          Thương mời bạn đến chung vui ngày tốt nghiệp cùng mình!"
        </p>
      </div>

      <!-- Action Button -->
      <div class="action-container">
        <button class="open-invitation-btn" id="openInvitationBtn">
          <span class="btn-sparkle">✨</span>
          <span class="btn-label">Mở Thiệp Mời</span>
          <span class="btn-sparkle">✨</span>
          <div class="btn-light-sweep"></div>
        </button>
      </div>

      <!-- Touch Hint -->
      <p class="touch-hint">Chạm vào màn hình để thả hoa rơi</p>
    </div>
  </main>

  <!-- Fullscreen Modal / Multi-Page Invitation (Mobile Optimized) -->
  <section class="modal-invitation" id="invitationModal" aria-hidden="true">
    <div class="modal-backdrop" id="modalBackdrop"></div>
    <div class="modal-container">
      
      <!-- Navigation / Tab Header -->
      <div class="modal-nav">
        <button class="nav-tab active" data-tab="tab-invite">💌 Thiệp Mời</button>
        <button class="nav-tab" data-tab="tab-map">🗺️ Sơ Đồ & Chỉ Đường</button>
        <button class="btn-close-modal" id="closeModalBtn" aria-label="Đóng">&times;</button>
      </div>

      <!-- Scrollable Content Area -->
      <div class="modal-scroll-area">
        
        <!-- Tab 1: Invitation Card (1.png / 2.png / 3.png) -->
        <div class="tab-pane active" id="tab-invite">
          <!-- Time Slot Selector -->
          <div class="time-selector">
            <span class="selector-label">Chọn khung giờ dự lễ:</span>
            <div class="time-pills">
              <button class="time-pill active" data-img="1.png">09:30</button>
              <button class="time-pill" data-img="2.png">10:00</button>
              <button class="time-pill" data-img="3.png">10:30</button>
            </div>
          </div>

          <!-- Invitation Card Image -->
          <div class="invitation-image-wrap">
            <img src="1.png" alt="Thiệp Mời Lễ Tốt Nghiệp Gia Vy" class="card-photo" id="invitePhoto">
          </div>
        </div>

        <!-- Tab 2: Map & Instructions (4.png) -->
        <div class="tab-pane" id="tab-map">
          <div class="map-image-wrap">
            <img src="4.png" alt="Sơ đồ tòa nhà Đại học Công nghiệp TPHCM" class="card-photo">
          </div>

          <!-- Quick Action Buttons for Guests -->
          <div class="quick-contact-actions">
            <a href="tel:0941653262" class="action-link link-call">
              <span class="link-icon">📞</span>
              <span>Gọi cho Vy (0941 653 262)</span>
            </a>
            <a href="https://maps.google.com/?q=12+Nguyen+Van+Bao+Phuong+4+Go+Vap+Ho+Chi+Minh" target="_blank" rel="noopener noreferrer" class="action-link link-maps">
              <span class="link-icon">📍</span>
              <span>Mở Google Maps chỉ đường</span>
            </a>
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="modal-footer-bar">
        <button class="btn-replay" id="replayBtn">🌸 Xem lại Intro nở hoa</button>
      </div>
      
    </div>
  </section>

  <!-- Floating Audio Button -->
  <div class="audio-toggle-btn" id="audioToggle" title="Bật/Tắt nhạc nền nhẹ">
    <span class="audio-symbol">🎵</span>
  </div>

  <!-- JavaScript -->
  <script src="script.js"></script>
</body>
</html>
